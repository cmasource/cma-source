name: Import cma_source release
on:
  push:
    paths:
      - README.md
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release bundle
        run: curl --fail --location 'https://oaisdmntprwestcentralus.blob.core.windows.net/files/00000000-06e0-81fb-b096-a2c6b94dea19/raw?se=2026-09-14T20%3A26%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a161-8fc1-7ced-a22f-ff95d03373bb&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T10%3A40%3A06Z&ske=2026-09-15T10%3A40%3A06Z&sks=b&skv=2026-02-06&sig=D4vchQC%2BTgJ1F5I2x6OwudXFEfPrz3/6hfPNobcxMNU%3D' --output /tmp/cma-source.zip
      - name: Extract project
        run: |
          mkdir -p /tmp/cma-source
          unzip -q /tmp/cma-source.zip -d /tmp/cma-source
          rsync -a --exclude='.git' --exclude='.github' /tmp/cma-source/ ./
      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import cma_source website' || exit 0
          git push
